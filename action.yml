name: copy-langcheck
description: Spelling and grammar gate for marketing copy in Czech, Slovak, Polish, German and English (Hunspell + LanguageTool + Korektor). Fails the job when the copy has a mistake.
branding:
  icon: check-circle
  color: green
inputs:
  files:
    description: Files to check (text, Markdown, HTML or JSON). Separated by spaces, or one per line when a path has spaces. Globs like copy/*.json work.
    required: true
  lang:
    description: Language (cs, sk, pl, de, en). Leave empty when every file states its own (HTML lang, JSON "lang").
    required: false
    default: ''
  all-strings:
    description: For JSON files, check every string value, not only the known copy keys.
    required: false
    default: 'false'
  languagetool:
    description: Start a LanguageTool server for grammar (sk, pl, de, en). Adds about a minute.
    required: false
    default: 'true'
  online:
    description: Also use Korektor (public LINDAT API) for Czech. Sends the text to a third party; its models are CC BY-NC-SA, so commercial use needs the authors' permission.
    required: false
    default: 'false'
  strict:
    description: Fail (exit code 3) when any layer that applies could not run, for example LanguageTool did not start.
    required: false
    default: 'false'
  ignore:
    description: Path to a file with words that are right on purpose, one per line.
    required: false
    default: ''
outputs:
  exit-code:
    description: 0 clean, 1 findings, 2 bad input, 3 could not check.
    value: ${{ steps.check.outputs.exit-code }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install spylls
      shell: bash
      run: python -m pip install -q -r "$GITHUB_ACTION_PATH/requirements.txt"
    - name: Dictionary cache key
      id: dicts
      shell: bash
      run: |
        echo "dir=$RUNNER_TEMP/copy-langcheck-dicts" >> "$GITHUB_OUTPUT"
        echo "key=copy-langcheck-dicts-$(sha256sum "$GITHUB_ACTION_PATH/fetch_dicts.py" | cut -c1-16)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v5
      with:
        path: ${{ steps.dicts.outputs.dir }}
        key: ${{ steps.dicts.outputs.key }}
    - name: Fetch dictionaries
      shell: bash
      env:
        LANGTOOLS_DICTS: ${{ steps.dicts.outputs.dir }}
      run: python "$GITHUB_ACTION_PATH/fetch_dicts.py"
    - name: Start LanguageTool
      if: inputs.languagetool == 'true'
      shell: bash
      run: |
        docker run -d --name languagetool -p 8081:8010 erikvl87/languagetool:6.8 >/dev/null
        for i in $(seq 1 60); do
          curl -sf "http://localhost:8081/v2/check?language=en-GB&text=Test." >/dev/null && { echo "LanguageTool up after $((i * 2)) s"; exit 0; }
          sleep 2
        done
        echo "::warning::LanguageTool did not start, grammar will not be checked"
    - name: Check the copy
      id: check
      shell: bash
      env:
        LANGTOOLS_DICTS: ${{ steps.dicts.outputs.dir }}
        INPUT_FILES: ${{ inputs.files }}
        INPUT_LANG: ${{ inputs.lang }}
        INPUT_ALL: ${{ inputs.all-strings }}
        INPUT_LT: ${{ inputs.languagetool }}
        INPUT_ONLINE: ${{ inputs.online }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_IGNORE: ${{ inputs.ignore }}
      run: |
        shopt -s globstar
        args=()
        [ -n "$INPUT_LANG" ] && args+=(--lang "$INPUT_LANG")
        [ "$INPUT_ALL" = "true" ] && args+=(--all-strings)
        [ "$INPUT_LT" = "true" ] || args+=(--no-languagetool)
        [ "$INPUT_ONLINE" = "true" ] && args+=(--online)
        [ "$INPUT_STRICT" = "true" ] && args+=(--strict)
        [ -n "$INPUT_IGNORE" ] && args+=(--ignore "$INPUT_IGNORE")
        # One path per line when there are several lines (paths may contain spaces),
        # otherwise space-separated. Globs are expanded; an unmatched one stays as
        # written, so langcheck reports "file not found" instead of skipping it.
        files=()
        mapfile -t lines < <(printf '%s\n' "$INPUT_FILES" | sed '/^[[:space:]]*$/d')
        for line in "${lines[@]}"; do
          if [ "${#lines[@]}" -gt 1 ]; then tokens=("$(echo "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')")
          else read -ra tokens <<< "$line"; fi
          for t in "${tokens[@]}"; do
            if [[ "$t" == *[*?[]* ]]; then
              matches=()
              while IFS= read -r m; do matches+=("$m"); done < <(compgen -G "$t" | sort)
              if [ "${#matches[@]}" -gt 0 ]; then files+=("${matches[@]}"); else files+=("$t"); fi
            else
              files+=("$t")
            fi
          done
        done
        status=0
        python "$GITHUB_ACTION_PATH/langcheck.py" "${args[@]}" -- "${files[@]}" || status=$?
        echo "exit-code=$status" >> "$GITHUB_OUTPUT"
        exit $status
