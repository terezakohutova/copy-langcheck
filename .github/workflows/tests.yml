# Unit tests (offline: fixture dictionary, mocked LanguageTool and Korektor) plus
# the example checks with the real dictionaries, on all three OSes.
name: tests
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install ruff==0.17.0
      - run: ruff check .

  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache@v5
        with:
          path: dicts
          key: dicts-${{ hashFiles('fetch_dicts.py', 'langcheck.py') }}
      - run: python fetch_dicts.py
      - run: python -m unittest -v
